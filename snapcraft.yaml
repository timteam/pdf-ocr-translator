name: pdf-ocr-translator
version: 0.1.0
title: PDF OCR Translator
summary: Fully offline PDF OCR and translation app
description: |
  PDF OCR Translator extracts text from image-based PDF files using
  Tesseract OCR and translates it to multiple languages. All OCR
  processing happens locally on your device — no backend, no cloud.

license: Apache-2.0
contact: timothee.troncy@gmail.com

grade: stable
confinement: strict
base: core24

apps:
  pdf-ocr-translator:
    command: pdf_ocr_translator
    environment:
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/4.00/tessdata
    plugs:
      - home
      - network
      - opengl
      - wayland
      - x11
      - removable-media

parts:
  flutter-app:
    plugin: dump
    source: ./flutter_app/build/linux/x64/release/bundle
    source-type: local
    organize:
      '*': ./
    stage:
      - '*'

  # Dépendances GTK3 requises par libflutter_linux_gtk.so et les plugins
  gtk-runtime:
    plugin: nil
    stage-packages:
      - libatk1.0-0
      - libcairo2
      - libepoxy0
      - libgdk-pixbuf2.0-0
      - libgtk-3-0
      - libgl1
      - libgles2
      - libegl1

  tesseract:
    plugin: nil
    stage-packages:
      - poppler-utils
      - tesseract-ocr
    # Exclure les tessdata installés par les dépendances apt (tesseract-ocr-eng,
    # etc.) — remplacés par les modèles best du part tessdata-best ci-dessous.
    stage:
      - -usr/share/tesseract-ocr/4.00/tessdata/
    prime:
      - -usr/lib/x86_64-linux-gnu/libicuio.so*
      - -usr/lib/x86_64-linux-gnu/libicutest.so*
      - -usr/lib/x86_64-linux-gnu/libssl3.so*

  # Modèles tessdata_best — téléchargés localement via scripts/setup_tessdata_best.sh
  # avant de builder le snap. Les fichiers .traineddata remplacent les modèles
  # standard des packages apt (meilleure précision, même chemin TESSDATA_PREFIX).
  tessdata-best:
    plugin: nil
    source: tessdata
    source-type: local
    override-build: |
      set -e
      DEST=$SNAPCRAFT_PART_INSTALL/usr/share/tesseract-ocr/4.00/tessdata
      mkdir -p $DEST
      cp $SNAPCRAFT_PART_SRC/*.traineddata $DEST/
