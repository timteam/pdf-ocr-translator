name: pdf-ocr-translator
version: '0.1.0'
summary: Fully offline PDF OCR and translation app
description: |
  PDF OCR Translator is a fully offline application that extracts text from PDF files
  using OCR technology and translates it to multiple languages. All processing happens
  locally on your device - no internet connection required after initial setup.

  Features:
  - Extract text from PDF images using Google ML Kit OCR
  - Translate to over 100 languages with local caching
  - Process PDFs completely offline
  - Cross-platform support (Linux, Windows, macOS, Android, iOS)
  - Privacy-first: no data sent to external servers

grade: stable
confinement: strict
base: core22

architectures:
  - build-on: amd64
  - build-on: arm64

apps:
  pdf-ocr-translator:
    command: bin/pdf-ocr-translator
    extensions: [gnome]
    plugs:
      - home
      - network
      - network-status
      - opengl
      - wayland
      - x11
      - audio-playback
      - camera
      - removable-media
      - screen-inhibit-control
    environment:
      # Flutter desktop environment variables
      DISPLAY: $DISPLAY
      WAYLAND_DISPLAY: $WAYLAND_DISPLAY
      XDG_SESSION_TYPE: $XDG_SESSION_TYPE
      GTK_USE_PORTAL: 1
      # Disable analytics
      FLUTTER_ANALYTICS: false

parts:
  flutter-app:
    plugin: nil
    source: flutter_app/
    build-packages:
      - curl
      - unzip
      - xz-utils
      - libglu1-mesa
      - libgtk-3-dev
      - libxss1
      - libgconf-2-4
      - libxrandr2
      - libasound2
      - libpangocairo-1.0-0
      - libatk1.0-0
      - libcairo-gobject2
      - libgtk-3-0
      - libgdk-pixbuf2.0-0
    stage-packages:
      - libgtk-3-0
      - libxss1
      - libgconf-2-4
      - libxrandr2
      - libasound2
      - libpangocairo-1.0-0
      - libatk1.0-0
      - libcairo-gobject2
      - libgdk-pixbuf2.0-0
      - libglu1-mesa
      - libgles2-mesa
      - mesa-utils
      - x11-utils
    override-build: |
      set -eux

      # Install Flutter
      FLUTTER_VERSION="3.16.9"
      FLUTTER_CHANNEL="stable"
      FLUTTER_HOME="/opt/flutter"

      mkdir -p "$FLUTTER_HOME"
      curl -L "https://storage.googleapis.com/flutter_infra_release/releases/${FLUTTER_CHANNEL}/linux/flutter_linux_${FLUTTER_VERSION}-${FLUTTER_CHANNEL}.tar.xz" | tar -xJ -C /opt

      export PATH="$FLUTTER_HOME/bin:$PATH"

      # Accept Flutter licenses
      flutter doctor --android-licenses || true
      flutter doctor --accept-android-licenses || true

      # Configure Flutter for Linux desktop
      flutter config --enable-linux-desktop
      flutter config --no-analytics

      # Get dependencies
      flutter pub get

      # Build Linux app
      flutter build linux --release

      # Install to snap
      mkdir -p "$SNAPCRAFT_PART_INSTALL/bin"
      cp -r build/linux/x64/release/bundle/* "$SNAPCRAFT_PART_INSTALL/"

      # Create wrapper script
      cat > "$SNAPCRAFT_PART_INSTALL/bin/pdf-ocr-translator" << 'EOF'
      #!/bin/bash
      set -e

      # Set up environment
      export LD_LIBRARY_PATH="$SNAP/lib:$SNAP/lib/x86_64-linux-gnu:$SNAP/usr/lib:$SNAP/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"
      export PATH="$SNAP/bin:$SNAP/usr/bin:$PATH"

      # Run the Flutter app
      exec "$SNAP/pdf_ocr_translator"
      EOF

      chmod +x "$SNAPCRAFT_PART_INSTALL/bin/pdf-ocr-translator"

  cleanup:
    after: [flutter-app]
    plugin: nil
    build-snaps: [flutter/latest/stable]
    override-build: |
      set -eux
      # Clean up build artifacts to reduce snap size
      rm -rf /opt/flutter
      snapcraftctl build