name: pdf-ocr-translator
version: 0.1.0
title: PDF OCR Translator
summary: Fully offline PDF OCR and translation app
description: |
  PDF OCR Translator extracts text from image-based PDF files using
  PaddleOCR and translates it offline using Opus-MT neural models.
  Language detection uses FastText LID (176 languages).
  All processing happens locally on your device — no backend, no cloud.

  On first use, PaddleOCR recognition models (~200 MB) and translation
  models (~50 MB per language pair) are downloaded automatically.

license: Apache-2.0
website: https://github.com/timteam/pdf-ocr-translator
contact: timothee.troncy@gmail.com

grade: devel
confinement: strict
base: core26
build-base: devel

lint:
  ignore:
    - library
    - classic

apps:
  pdf-ocr-translator:
    command: pdf_ocr_translator
    environment:
      # Rend les packages pip (PaddleOCR, ctranslate2, fasttext…) visibles par python3
      PYTHONPATH: $SNAP/pyenv
    plugs:
      - home
      - network
      - opengl
      - wayland
      - x11
      - removable-media

parts:
  flutter-app:
    plugin: dump
    source: ./flutter_app/build/linux/x64/release/bundle
    source-type: local
    organize:
      '*': ./
    stage:
      - '*'

  # Dépendances GTK3 requises par libflutter_linux_gtk.so et les plugins
  gtk-runtime:
    plugin: nil
    stage-packages:
      - libatk1.0-0
      - libcairo2
      - libepoxy0
      - libgdk-pixbuf2.0-0
      - libgtk-3-0
      - libgl1
      - libgles2
      - libegl1

  # Outils PDF : rendu page (pdftoppm), comptage (pdfinfo), texte embarqué (pdftotext)
  # curl : téléchargement des modèles Opus-MT depuis HuggingFace au runtime
  poppler:
    plugin: nil
    stage-packages:
      - poppler-utils
      - curl
    stage:
      - -usr/lib/x86_64-linux-gnu/libgnutls*
      - -usr/share/doc/libgnutls*

  # Environnement Python : PaddleOCR + FastText LID + Opus-MT (ctranslate2 + sentencepiece).
  # Wheels pré-téléchargés sur l'hôte via scripts/download_pip_wheels.sh (Python 3.12, linux x86_64),
  # puis copiés dans le container LXC. Aucun réseau requis pendant le build.
  # PYTHONPATH=$SNAP/pyenv rend les packages visibles par python3 au runtime.
  python-env:
    plugin: nil
    source: wheels
    source-type: local
    build-packages:
      - python3
      - python3-pip
    stage-packages:
      - python3
      - libgomp1
      - libopenblas0
    override-build: |
      set -e
      pip3 install \
        --no-cache-dir \
        --break-system-packages \
        --no-index \
        --find-links "$SNAPCRAFT_PART_SRC" \
        --target "$SNAPCRAFT_PART_INSTALL/pyenv" \
        paddlepaddle \
        paddleocr \
        ctranslate2 \
        sentencepiece \
        fasttext-wheel
