name: CI - Mobile (Android & iOS)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  flutter-build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Get Flutter dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Analyze Flutter code
        run: |
          cd flutter_app
          flutter analyze

      - name: Build Android APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: flutter_app/build/app/outputs/flutter-app-release.apk

  flutter-build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Install iOS dependencies
        run: |
          pod repo update

      - name: Get Flutter dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Analyze Flutter code
        run: |
          cd flutter_app
          flutter analyze

      - name: Build iOS
        run: |
          cd flutter_app
          flutter build ios --release --no-codesign

      - name: Upload iOS build
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: flutter_app/build/ios/Release-iphoneos

  flutter-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Get Flutter dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Run Flutter tests
        run: |
          cd flutter_app
          flutter test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          flags: flutter
          fail_ci_if_error: false
