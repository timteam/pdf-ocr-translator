# Docker Compose for local development
# Brings up both backend API and frontend services

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: pdf-ocr-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./output:/app/output
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    networks:
      - pdf-ocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.flutter
    container_name: pdf-ocr-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
    networks:
      - pdf-ocr-network
    restart: unless-stopped

networks:
  pdf-ocr-network:
    driver: bridge

volumes:
  output:
  logs:
