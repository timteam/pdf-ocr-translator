name: pdf_ocr_translator
description: "Open source PDF OCR and translation - Fully offline client-side app"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & routing
  go_router: ^17.0.0

  # File handling
  file_picker: ^11.0.0
  path: ^1.8.3
  path_provider: ^2.1.0

  # PDF processing
  pdf: ^3.10.0

  # Image processing
  image: ^4.1.0

  # Permissions
  permission_handler: ^12.0.0

  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/models/
    - assets/models/onnx/
    - assets/scripts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
