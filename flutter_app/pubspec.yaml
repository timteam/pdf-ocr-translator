name: pdf_ocr_translator
description: "Open source PDF OCR and translation - Fully offline client-side app"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & routing
  go_router: ^17.0.0

  # File handling
  file_picker: ^11.0.0
  path: ^1.8.3
  path_provider: ^2.1.0

  # PDF processing
  pdf: ^3.10.0

  # Image processing
  image: ^4.1.0

  # Permissions
  permission_handler: ^12.0.0

  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/models/
    - assets/models/onnx/
    - assets/scripts/
    - assets/translation_models/
    - assets/translation_models/ja-en/
    - assets/translation_models/zh-en/
    - assets/translation_models/ko-en/
    - assets/translation_models/ru-en/
    - assets/translation_models/ar-en/
    - assets/translation_models/hi-en/
    - assets/translation_models/th-en/
    - assets/translation_models/vi-en/
    - assets/translation_models/de-en/
    - assets/translation_models/nl-en/
    - assets/translation_models/pl-en/
    - assets/translation_models/ROMANCE-en/
    - assets/translation_models/en-ROMANCE/
    - assets/translation_models/en-zh/
    - assets/translation_models/en-de/
    - assets/translation_models/en-nl/
    - assets/translation_models/en-ru/
    - assets/translation_models/en-hi/
    - assets/translation_models/en-ar/
    - assets/translation_models/en-vi/
    - assets/translation_models/en-mul/
    - assets/translation_models/tc-big-en-ar/
    - assets/translation_models/tc-big-en-ko/
    - assets/translation_models/en-sla/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
